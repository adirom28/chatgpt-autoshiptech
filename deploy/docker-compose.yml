
services:
  db:
    image: postgres:15
    container_name: autoshiptech-db
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: autoshiptech
    volumes:
      - db_data:/var/lib/postgresql/data
      - ../sql:/sql
    ports:
      - "5432:5432"

  server:
    build: ./server
    container_name: autoshiptech-server
    env_file: ./server/.env
    depends_on:
      - db
    ports:
      - "8080:8080"

  dashboard:
    image: node:20
    working_dir: /app
    volumes:
      - ../dashboard:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"

  widget:
    image: nginx:alpine
    container_name: autoshiptech-widget
    volumes:
      - ../widget:/usr/share/nginx/html
    ports:
      - "8081:80"

  proxy:
    image: nginx:alpine
    container_name: autoshiptech-proxy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../widget:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    depends_on:
      - server
      - dashboard
      - widget

volumes:
  db_data:
